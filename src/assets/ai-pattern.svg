
<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="ai-grid" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 0,10 L 20,10 M 10,0 L 10,20" stroke="rgba(180, 167, 255, 0.1)" stroke-width="0.5" fill="none"/>
    </pattern>
    <pattern id="ai-dots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="1" fill="rgba(180, 167, 255, 0.15)"/>
    </pattern>
  </defs>
  <rect x="0" y="0" width="100" height="100" fill="url(#ai-grid)"/>
  <rect x="0" y="0" width="100" height="100" fill="url(#ai-dots)"/>
</svg>
